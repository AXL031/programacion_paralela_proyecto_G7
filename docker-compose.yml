name: transporte-g7

services:
  mongo:
    image: mongo:8.0.16
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4.7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: deploy/go.Dockerfile
      args:
        COMMAND: api
    restart: unless-stopped
    environment:
      HTTP_ADDR: ':8080'
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: ${MONGO_DATABASE:-transporte}
      REDIS_ADDR: redis:6379
      MASTER_HTTP: http://master:8081

      JWT_SECRET: ${JWT_SECRET:?Ejecuta scripts/init-env.ps1}
      DEMO_USER: ${DEMO_USER:?Ejecuta scripts/init-env.ps1}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Ejecuta scripts/init-env.ps1}
      MASTER_API_TOKEN: ${MASTER_API_TOKEN:?Ejecuta scripts/init-env.ps1}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://127.0.0.1:${WEB_PORT:-3000}}
      AUTH_SECURE_COOKIE: ${AUTH_SECURE_COOKIE:-false}
    ports:
      - '127.0.0.1:${API_PORT:-8080}:8080'
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/service", "-check-ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:8080
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/service", "-check-ready"]
      interval: 10s
      timeout: 4s
      retries: 10

  master:
    build:
      context: .
      dockerfile: deploy/go.Dockerfile
      args:
        COMMAND: master
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: ${MONGO_DATABASE:-transporte}
      GOMAXPROCS: '1'
      MASTER_API_TOKEN: ${MASTER_API_TOKEN:?Ejecuta scripts/init-env.ps1}
    volumes:
      - ./data:/app/data
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/service", "-check-ready"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: deploy/go.Dockerfile
      args:
        COMMAND: worker
    restart: unless-stopped
    environment:
      MASTER_ADDR: master:9000
      DATA_ROOT: data
      GOMAXPROCS: '1'
    volumes:
      - ./data:/app/data:ro
    depends_on:
      master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/service", "-check-ready"]
      interval: 5s
      timeout: 4s
      retries: 10

  trainer:
    profiles: [jobs]
    build:
      context: .
      dockerfile: deploy/go.Dockerfile
      args:
        COMMAND: trainer
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: ${MONGO_DATABASE:-transporte}
      MASTER_HTTP: http://master:8081
      GOMAXPROCS: '1'
      MASTER_API_TOKEN: ${MASTER_API_TOKEN:?Ejecuta scripts/init-env.ps1}
    volumes:
      - ./data:/app/data
    depends_on:
      mongo:
        condition: service_healthy
    command: ["-mode", "sequential", "-config", "configs/training.json"]

  loader:
    profiles: [jobs]
    build:
      context: .
      dockerfile: deploy/go.Dockerfile
      args:
        COMMAND: loader
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: ${MONGO_DATABASE:-transporte}
    volumes:
      - ./data:/app/data
      - ./tests/testdata:/app/tests/testdata:ro
    depends_on:
      mongo:
        condition: service_healthy
    command: ["-config", "configs/demo.json"]

  dev:
    profiles: [tools]
    image: golang:1.27.2-bookworm
    working_dir: /workspace
    volumes:
      - .:/workspace
      - go_modules:/go/pkg/mod
      - go_build:/root/.cache/go-build
    environment:
      MONGO_TEST_URI: mongodb://mongo:27017
    command: ["go", "test", "-race", "./..."]
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
  go_modules:
  go_build:
